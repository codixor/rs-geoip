name: Rust checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: [country, city, "country,build", "city,build", builtin, native-tools]
    env:
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: bash scripts/feature-matrix.sh "$FEATURES"
      - name: Check source-only repository and package contents
        if: matrix.features == 'country'
        shell: bash
        run: |
          set -eu
          git ls-files > "$RUNNER_TEMP/geoip-tracked"
          cargo package --locked --list > "$RUNNER_TEMP/geoip-package"
          # Cargo generates this metadata file when packaging a Git checkout.
          sed -i '/^\.cargo_vcs_info\.json$/d' "$RUNNER_TEMP/geoip-package"
          if grep -Ei '\.(bin|lz4|mmdb|csv(\.gz)?|tsv(\.gz)?|json)$' "$RUNNER_TEMP/geoip-tracked" "$RUNNER_TEMP/geoip-package"; then
            exit 1
          fi

      - name: Test database updates and failed downloads
        if: matrix.features == 'country,build'
        shell: bash
        run: |
          cargo build --locked --no-default-features --features build --bin rs-geo-country-build
          COUNTRY_DB_BUILDER="$PWD/target/debug/rs-geo-country-build" sh tests/update-country-db.sh
      - name: Check the release archive and dependency-free reader
        if: matrix.features == 'country'
        shell: bash
        run: |
          set -eu
          test "$(cargo tree --locked --no-default-features --features country --prefix none | wc -l)" -eq 1
          cargo package --locked
          python3 scripts/check-package.py target/package/rs-geoip-*.crate
      - name: Embed and open locally generated city packs
        if: matrix.features == 'city,build'
        shell: bash
        run: |
          set -eu
          input="$RUNNER_TEMP/synthetic-city.json"
          printf '[\n%s\n]\n' '{"ip_range_start":"192.0.2.0","ip_range_end":"192.0.2.255","city_name":"Example","country_code":"ZZ","latitude":1.0,"longitude":2.0}' > "$input"
          bash scripts/build-ip-city-artifacts.sh "$input"
          cargo test --locked --features builtin --test local_ip_fallback builtin_availability_matches_local_inputs
